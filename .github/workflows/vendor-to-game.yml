# Vendor SoT → Potatoblock-Game (config: potatoblock-vendor.json).
# Game repo CD then uploads the whole tree to MCS /app.
name: Vendor to Potatoblock-Game

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Pass --skip-build to prepare (reuse existing dist)"
        type: boolean
        default: false

concurrency:
  group: vendor-potatoblock-game
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout SoT
        uses: actions/checkout@v4

      - name: Setup Node (prepare may build frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendor into Potatoblock-Game
        env:
          POTATOBLOCK_GAME_TOKEN: ${{ secrets.POTATOBLOCK_GAME_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_build }}" = "true" ]; then
            EXTRA+=(--skip-build)
          fi
          python scripts/vendor_to_game.py "${EXTRA[@]}"
